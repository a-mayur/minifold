[package]
name = "minifold"
version = "0.2.0"
edition = "2024"
description = "Minifold - a lightweight self-hosted file compressor"
license = "MIT"
publish = false

[dependencies]
axum = "0.8"
futures-util = "0.3"
fs4 = { version = "0.13", features = ["sync"] }
infer = "0.19"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "io-util", "net", "signal", "sync", "time"] }
tokio-util = { version = "0.7", features = ["io"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt"] }
uuid = { version = "1", features = ["v4", "serde"] }
zstd = "0.13"
toml = "0.9"
mozjpeg = "0.10.13"
oxipng = { version = "10.2.1", default-features = false }
webp = { version = "0.3.1", default-features = false }
image = { version = "0.25.10", default-features = false, features = ["bmp", "png"] }

[profile.release]
# mozjpeg reports libjpeg errors by unwinding; "abort" would crash the server on a bad JPEG.
panic = "unwind"
lto = true
codegen-units = 1
strip = true
